
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Need for Speed: Most Wanted</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #121212;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="loading">Loading game...</div>
<div id="game"></div>

<script>
    window.EJS_player = "#game";
    window.EJS_core = "gba";
    window.EJS_gameName = "Need for Speed: Most Wanted";

    // Game ZIP hosted in your own GitHub repository
    window.EJS_gameUrl = "./nfsmostwanted.zip";

    // Emulator runtime hosted externally
    window.EJS_pathtodata =
        "https://cdn.jsdelivr.net/gh/genizy/emu@master/";

    window.EJS_color = "#0064ff";
    window.EJS_startOnLoaded = true;

    window.EJS_ready = function () {
        document.getElementById("loading").remove();
    };
</script>

<script src="https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js"></script>

</body>
</html>
