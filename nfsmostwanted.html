
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Need for Speed: Most Wanted</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="game"></div>

<script>
    window.EJS_player = "#game";
    window.EJS_core = "gba";
    window.EJS_gameName = "Need for Speed: Most Wanted";
    window.EJS_color = "#0064ff";
    window.EJS_startOnLoaded = true;

    // Your own GitHub fork
    window.EJS_gameUrl =
        "https://cdn.jsdelivr.net/gh/watermelonsqueaks/emujs@main/nfsmostwanted.zip";

    // Official EmulatorJS CDN
    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";
</script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
